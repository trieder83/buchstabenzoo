# ================================================================ burglar event (GAME-EVENTS rules 4-7; proposal Q-139)
# kind: burglar_entry (where the two burglars climb in: a ladder leaning on the inside of the
# wall/hedge, pos + facing into the level), burglar_target (what they take: `target` = building
# whose food boxes / item they take), burglar_hideout (catch area: walkable grass rect where they
# crouch with their sack; the child catches them there; never a hiding-place rect, scenery,
# garden or path). The footprint trail runs along the fastest walk target -> hideout.
