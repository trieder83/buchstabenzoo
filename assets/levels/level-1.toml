# ================================================================ scenery (non-solid)
# Proposal Q-080: ground dressing that provides riddle features but does not change the grid —
# its cells stay walkable with surface "grass" (GAME-LAYOUT Q-046); like food boxes it is not
# an [[element]]. Never overlaps a solid element or a path; each kind exists only once in
# level 1 (riddle guard, LAYOUT-L1-008). props = modular props of ART-ENVIRONMENT.

[[scenery]]
id = "tall_grass_ne"
kind = "tall_grass"
rect = [15, 31, 7, 3]
hiding_place = "loc_meadow"
props = ["grass_tuft (x3 scale, dense)", "wildflowers", "butterfly"]
notes = "Knee-high (zebra belly-high) grass with red/yellow/white wildflowers and 3-4 fluttering butterflies. The only tall grass and the only butterflies in level 1."

[[scenery]]
id = "sand_n"
kind = "sand_patch"
rect = [-1, 42, 7, 4]
hiding_place = "loc_sand"
props = ["sand_tile", "rock"]
notes = "Dry yellow sand patch (dust bath) north of the panda enclosure; no grass tufts on it, a few small rocks at the rim. The only sand in level 1."

[[scenery]]
id = "mud_nw"
kind = "mud_puddle"
rect = [-20, 42, 7, 4]
hiding_place = "loc_mud"
props = ["mud_tile", "grass_tuft"]
notes = "Big brown mud puddle (after rain), glossy wet highlights, splashes and footprints at the rim. Not water: no lilies, no frogs, no reeds, brown not blue. The only mud in level 1."

[[scenery]]
id = "shade_w"
kind = "tree_shade"
rect = [-22, 33, 2, 7]
hiding_place = "loc_shade"
props = ["shade_decal", "grass_tuft"]
notes = "Corridor between the west zoo wall and trees_nw; the tree crowns overhang it; flat dark-green shade decal on the ground (cool, dry grass). The only place where big trees stand right at the zoo wall."

[[scenery]]
id = "leaf_pile_ne"
kind = "leaf_pile"
rect = [15, 43, 4, 2]
hiding_place = "loc_leaves"
props = ["leaf_pile", "rake"]
notes = "Big raked heap of red, yellow and brown leaves at the north edge of trees_ne, a rake leaning on a tree. Sunlit (not dark — must not look like loc_cave). The only leaf pile in level 1."
