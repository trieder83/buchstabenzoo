# Level 1 layout data — mirrors the element table in specs/10-gameplay/levels/level-1.md
# (GAME-LEVEL-1). LAYOUT-005 checks that ids and rectangles agree with the spec.
#
# Grid: 1 m cells, origin = centre of the zoo entrance gate, +X east, +Z north (GAME-LAYOUT).
# rect = [x, z, w, d]  → covers cells x .. x+w-1, z .. z+d-1 (x/z = south-west corner).
#
# PROPOSALS (not yet decided, see specs/open-questions.md):
#   - type "hiding_place" and its fields (Q-044)
#   - [[hiding_place]] list (all candidate hiding places, discovery decision 2026-09-26) and
#     [[scenery]] list (non-solid ground dressing) at the end of this file (Q-080)
#   - blocks_view / height_m fields for the "not visible from own enclosure" test (Q-044)
#   - barrier unlock conditions (Q-022)
#   - tree-area data: `density` + explicit `trees` list for sparse woods (GAME-LAYOUT "Forests",
#     user decision 2026-09-26; data shape proposal Q-085)
#   - [[enclosure_feature]] list (hippo pool) and `home_wander_on` on enclosures (Q-085)
#   - vegetable garden: [[garden]], [[garden_bed]], [[plant_spot]] lists at the end of this file
#     and the path_garden element (GAME-GARDEN, GAME-LEVEL-1 "Vegetable garden"; Q-102)
#
# DECIDED (user 2026-09-26): tree areas are `dense` (solid as a whole) or `sparse` (walkable
# between the trees; only trunks/bushes are solid — GAME-LAYOUT "Forests"); the hippo
# enclosure has a pool covering about half of it (GAME-LEVEL-1 "Hippo enclosure pool").
#
# MIGRATION DONE (M5a, Q-080 answered): zoo-core reads hiding places only from the
# [[hiding_place]] list; the legacy `[[element]] type = "hiding_place"` mirrors are deleted.
#
# DECIDED (Q-046, user 2026-09-26): cells not covered by a solid element are walkable.
# Surface: cells of `path` elements (incl. bridge, jetty, cave floor) = "path" (full speed);
# every other walkable cell = ground_surface "grass" (slower, factor in GAME-PLAYER).

[level]
id = "level_1"
spec = "GAME-LEVEL-1"
cell_size_m = 1.0
bounds = [-24, -2, 48, 50]   # x, z, w, d — every border cell is covered by a solid element
ground_walkable = true       # decided Q-046
ground_surface = "grass"     # surface of walkable cells not covered by a path element
missions = ["zebra", "hippo", "panda"]   # missions in scope = interactable (Q-069, answered 2026-09-26: all three)

[spawn]
cell = [0, 2]                # stands on the entrance plaza, 2 m inside the gate
facing = "+z"                # looks north: food storage straight ahead
camera_yaw = "+z"            # camera south of the player, looking north (high-angle follow camera, GAME-PLAYER §2)

