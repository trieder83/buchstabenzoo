# ================================================================ enclosure features
# Proposal Q-085 (data shape): things inside an enclosure that change how its animal moves at
# home. Like food boxes and scenery they are NOT [[element]]s — the enclosure cells stay solid
# for the player (LAYOUT-003 unaffected). Fields:
#   id / enclosure / kind   `pool` = still water the animal may wander in (surface "water"
#                           of `home_wander_on`, GAME-ANIMALS "in_enclosure")
#   rect        cells covered by the pool incl. its tiled rim [x, z, w, d]
#   water       "still" (pond look, TECH-WATER; NO lilies, frogs, reeds or ducks — riddle guard)
#   ramp        cells of the shallow tiled entry ramp (part of rect, walkable for the animal)
#   ramp_side   side of the pool the ramp is on
#   edge_stones decoration rocks (model `rock`, scale 0.5) on the grass just outside the rim,
#               level (x, z) centres; solid for the animal's wander path
#   model       modelled asset (approved concept art/props/kit_enclosure_buildings, `pool_tiled`)

[[enclosure_feature]]
id = "hippo_pool"
enclosure = "enc_hippo"
kind = "pool"
rect = [11, 15, 8, 7]         # x 11-18, z 15-21: 56 of 130 inner cells (43 %), 2 cells from the gate
water = "still"
ramp = [11, 16, 1, 3]         # west side, facing the gate and the path in front of it
ramp_side = "-x"
edge_stones = [[10.4, 21.6], [11.4, 14.4], [13.6, 14.3]]   # NW corner and south rim; never in the 1 m strips east (x 19) and north (z 22) of the pool
model = "pool_tiled"
notes = "Square tiled pool (light blue/white tiles, 0.4 m rim), clear still water, no plants. Seen from the path in front of the gate (8, 15-16) 3-10 m to the east. The hippo spends most of its home time in it with only eyes, ears and back showing."

# ================================================================ hiding places (candidates)
# Discovery (user decision 2026-09-26, GAME-RESCUE §1): every animal has >= 3 candidate hiding
# places; one per animal is picked per playthrough with the seeded RNG (RESC-014).
# Proposal Q-080 — source of truth for hiding places (the [[element]] loc_* entries above are
# legacy mirrors). Fields:
#   id              `loc_*`, unique; also the riddle key part:
#                   mission-<animal>-riddle-<id>-<reading_level> (CONT-MISSIONS)
#   animal          animal id (GAME-ANIMALS)
#   rect            overlay area [x, z, w, d], NOT solid; contains the spot, every wander cell
#                   and the scenery of the place; rects of different animals never overlap
#   animal_spot     cell where the animal starts, returns to and is found (level x, z)
#   wander_radius_m escaped animals wander only to cells whose centre is within this distance
#                   of the spot centre (GAME-ANIMALS "Animal states": <= 3 m); the wander area
#                   is also clipped to `rect` (proposal Q-085) so it never spreads into the
#                   now walkable sparse woods trees_nw / trees_ne next to loc_shade, loc_mud,
#                   loc_meadow and loc_leaves
#   wander_on       surface the animal wanders on: "grass" (walkable non-path cell),
#                   "water" (cells of the pond landmark), "cave" (path cells of kind "cave")
#   features        riddle details the place must show (CONT-MISSIONS, LAYOUT-L1-007)
#   scenery         ids of [[scenery]] / [[element]] entries that provide the features
#   pose            clip played at the spot when not walking (proposal, Q-043)

[[hiding_place]]
id = "loc_river"
animal = "zebra"
rect = [6, 30, 4, 6]
animal_spot = [8, 32]
wander_radius_m = 3.0
wander_on = "grass"
features = ["flowing_water", "bridge", "ducks"]
scenery = ["river_n", "bridge_river"]
