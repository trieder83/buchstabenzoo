# Level 2 layout data — mirrors the element table in specs/10-gameplay/levels/level-2.md
# (GAME-LEVEL-2). LAYOUT-005 checks that ids and rectangles agree with the spec.
#
# Grid: 1 m cells in the SAME level coordinates as level 1 (origin = centre of the zoo entrance
# gate, +X east, +Z north; GAME-LAYOUT). Level 2 lies east of level 1 and is joined to it at the
# level-1 barrier `barrier_ne_tree` (GAME-LAYOUT "Joining levels", proposal Q-088).
# rect = [x, z, w, d] → covers cells x .. x+w-1, z .. z+d-1 (x/z = south-west corner).
#
# PROPOSALS (not yet decided, see specs/open-questions.md): [[entry]] tables and joined levels
# (Q-088); own food storage per level (Q-089); barrier unlock conditions (Q-022, Q-091);
# hiding-place list, scenery, perch height (Q-080, Q-094); tree density (Q-085);
# enclosure features (Q-085).

[level]
id = "level_2"
spec = "GAME-LEVEL-2"
cell_size_m = 1.0
bounds = [24, 12, 52, 50]   # x, z, w, d — every border cell is solid except the [[entry]] cells
ground_walkable = true       # decided Q-046
ground_surface = "grass"

[spawn]
cell = [27, 29]               # first path cells behind the opened barrier (level start / continue, proposal)
facing = "+x"
camera_yaw = "+x"

# Level entries (GAME-LAYOUT "Joining levels", proposal Q-088): cells of this level that are
# edge-adjacent to a barrier of an earlier level; they are the only walkable border cells.
[[entry]]
id = "entry_l2_west"
cells = [24, 28, 1, 3]
from_level = "level_1"
barrier = "barrier_ne_tree"

