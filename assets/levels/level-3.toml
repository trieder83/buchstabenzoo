# Level 3 layout data — mirrors the element table in specs/10-gameplay/levels/level-3.md
# (GAME-LEVEL-3). LAYOUT-005 checks that ids and rectangles agree with the spec.
#
# Grid: 1 m cells in the SAME level coordinates as levels 1 and 2 (origin = centre of the zoo
# entrance gate, +X east, +Z north; GAME-LAYOUT). Level 3 lies north of level 1 and west of
# level 2; it is joined to level 2 at `barrier_l2_construction` and (proposal Q-090) to
# level 1 at `barrier_north_gate` (GAME-LAYOUT "Joining levels", proposal Q-088).
# rect = [x, z, w, d] → covers cells x .. x+w-1, z .. z+d-1 (x/z = south-west corner).
#
# PROPOSALS (not yet decided, see specs/open-questions.md): [[entry]] tables (Q-088); second
# entry through the level-1 north gate (Q-090); own food storage (Q-089); enterable
# building `interior` (Q-092); [[item]] fish bowl and [[water_source]] (Q-093, Q-084);
# pirate ship as a playground landmark (Q-017); hiding places, scenery, perch (Q-080, Q-094).

[level]
id = "level_3"
spec = "GAME-LEVEL-3"
cell_size_m = 1.0
bounds = [-24, 48, 48, 46]   # x, z, w, d — every border cell is solid except the [[entry]] cells
ground_walkable = true       # decided Q-046
ground_surface = "grass"

[spawn]
cell = [20, 53]               # first path cells behind the opened barrier (level start / continue, proposal)
facing = "-x"
camera_yaw = "-x"

# Level entries (GAME-LAYOUT "Joining levels", proposal Q-088): cells of this level that are
# edge-adjacent to a barrier of an earlier level; they are the only walkable border cells.
[[entry]]
id = "entry_l3_east"
cells = [23, 52, 1, 3]
from_level = "level_2"
barrier = "barrier_l2_construction"

[[entry]]
id = "entry_l3_south"
cells = [-9, 48, 3, 1]
from_level = "level_1"
barrier = "barrier_north_gate"

