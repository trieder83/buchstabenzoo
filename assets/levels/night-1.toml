# Night level 1 layout data — mirrors the element table in specs/10-gameplay/levels/night-1.md
# (GAME-LEVEL-NIGHT-1). LAYOUT-005 checks that ids and rectangles agree with the spec.
#
# Grid: 1 m cells in the SAME level coordinates as the day levels (origin = centre of the zoo
# entrance gate, +X east, +Z north; GAME-LAYOUT). The night zoo lies WEST of level 1, behind the
# level-1 zoo wall; it is joined to level 1 only through the level-1 barrier `moon_door`
# (GAME-NIGHT rule 3, GAME-LAYOUT "Joining levels"). It exists only at night: the moon door is
# open during every night after level 1's nightfall and closed by day (proposal Q-133).
# rect = [x, z, w, d] → covers cells x .. x+w-1, z .. z+d-1 (x/z = south-west corner).
#
# PROPOSALS (not yet decided, see specs/open-questions.md):
#   - night level data: [level] time = "night", the moon door as entry barrier (Q-133)
#   - night house: enterable hall (`interior` + `door`, Q-092) with three indoor enclosures
#     behind glass fronts; `model_rect` = footprint of the whole house model incl. the
#     enclosure wing, roof hidden while the player is on a hall/door cell; boards outside in
#     front of the house (Q-134)
#   - own night food storage with 4 night foods, two animals share `beetles` (Q-135)
#   - riddle uniqueness scope: night levels are their own scope (Q-136)
#   - [[light]] list (lantern posts, string lights, wall lamps, board lamps — Q-118 answered,
#     data shape Q-137)
#   - hiding places, scenery, perch heights (Q-080 answered, Q-094)

[level]
id = "night_1"
spec = "GAME-LEVEL-NIGHT-1"
cell_size_m = 1.0
bounds = [-72, 6, 48, 48]    # x -72..-25, z 6..53 — every border cell is solid except the [[entry]] cells
ground_walkable = true       # decided Q-046
ground_surface = "grass"
missions = ["hedgehog", "bat", "owl"]   # GAME-NIGHT rule 6 (Q-076 answered)
time = "night"               # proposal Q-133: reachable only while it is night (the moon door is its only entry)

[spawn]
cell = [-28, 29]             # entry path, 3 m inside the moon door (used when a save is restored here without a position)
facing = "-x"                # looks west into the garden: plaza and food hut ahead, night house to the upper right
camera_yaw = "-x"

# Level entry (GAME-LAYOUT "Joining levels"): the cells edge-adjacent to the level-1 moon door.
[[entry]]
id = "entry_n1_moon"
cells = [-25, 29, 1, 2]
from_level = "level_1"
barrier = "moon_door"

