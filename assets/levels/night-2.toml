# Night level 2 layout data (the terrarium garden) - mirrors the element table in
# specs/10-gameplay/levels/night-2.md (GAME-LEVEL-NIGHT-2). LAYOUT-N2-004 checks that ids and
# rectangles agree with the spec.
#
# Frame: the plaza, hut, house and loop of night-1.toml SHIFTED 48 m WEST (same relative geometry);
# all riddle places, scenery and the house contents are new. Reached only through the lantern
# gate `barrier_n1_garden` in the west hedge of night_1 (opens the moment night_1 is complete,
# Q-331, answered 2026-10-04 "implement as recommended"). Optional: nothing waits for it (Q-332).
# rect = [x, z, w, d] -> covers cells x .. x+w-1, z .. z+d-1 (x/z = south-west corner).

[level]
id = "night_2"
spec = "GAME-LEVEL-NIGHT-2"
cell_size_m = 1.0
bounds = [-120, 6, 48, 48]    # x -120..-73, z 6..53 - every border cell is solid except the [[entry]] cells
ground_walkable = true
ground_surface = "grass"
missions = ["snake", "chameleon", "poison_dart_frog"]
time = "night"

[spawn]
cell = [-76, 25]             # entry path, 3 m inside the lantern gate (used when a save is restored here without a position)
facing = "-x"                # looks west into the garden: plaza and food hut ahead, terrarium house to the upper right
camera_yaw = "-x"

# Level entry: the cells edge-adjacent to the night_1 barrier `barrier_n1_garden`.
[[entry]]
id = "entry_n2_garden"
cells = [-73, 25, 1, 2]
from_level = "night_1"
barrier = "barrier_n1_garden"

