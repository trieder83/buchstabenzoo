# ---- goldfish (fish rig, tools/blender/animals/goldfish.py). Origin = water surface
# above the body centre; rest body centre 0.22 m below it. No root motion: the game moves
# the fish (swim) and carries it along the jump arc (happy, e.g. river -> bowl between
# splash_out and splash_in).
[goldfish.swim]
frames = 30
loop = true
crossfade_in = 0.20
events = {}

[goldfish.idle]
frames = 90
loop = true
crossfade_in = 0.25
events = {}

[goldfish.eat]
frames = 45
loop = false
crossfade_in = 0.15
