# frog (own frog rig, tools/blender/animals/frog.py). Origin on the ground at the feet (on a
# lily pad or the bank). hop: vertical hips arc only (peak +0.17 m) — NO forward root
# motion: the game carries the frog hop_distance m forward between takeoff and land (a
# 0.6 m hop in 14 frames = 0.47 s). swim: the hips sink 0.085 m so the body floats with the
# eyes out; while swimming the origin is the WATER SURFACE. croak: vocal sac puffs at the
# events.
[frog.idle]
frames = 90
loop = true
crossfade_in = 0.25
events = {}
kind = "ambient"

[frog.croak]
frames = 45
loop = false
crossfade_in = 0.15
events = { croak = 11, croak_2 = 28 }
kind = "ambient"

[frog.hop]
frames = 30
loop = false
crossfade_in = 0.08
events = { takeoff = 8, land = 22 }
hop_distance = 0.6
kind = "ambient"

[frog.swim]
frames = 30
loop = true
crossfade_in = 0.20
events = {}
speed = 0.3
kind = "ambient"

# ---- night animals (ART-ANIMALS "Night animals"; tools/blender/animals/{hedgehog,bat,owl}.py,
# night_kit.py). Every animal has `sleep` (loop; lying down / curled / tucked) and an
# `eye_glow` material slot (NIGHT-006).
# bat / owl: origin at the feet when perched. `perch` = idle with the toes curled over a branch
# whose top is the origin. `fly` is authored in place (no root motion) at the perched height;
