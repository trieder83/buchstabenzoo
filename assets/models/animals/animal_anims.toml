# ---- ambient animals (GAME-AMBIENT): decoration with behaviour, no missions. Every clip row
# carries kind = "ambient" (a per-clip key so both the TOML and the tiny Python parser of
# check_animal.py read it without an [animal] table). No root motion anywhere: the game
# moves / turns them.
#
# duck, duckling (bird rig, tools/blender/animals/bird_rig.py). Origin = WATER SURFACE under
# the body centre (like the goldfish): place the origin at the water height, never sink the
# model. swim.speed = authored paddling speed (playback rate = actual / speed, like walk);
# GAME-AMBIENT swims 0.3-0.6 m/s. dip: head under water between dip_under and dip_up (water
# rings, TECH-WATER); flap: splash when it drops back on the water.
[duck.swim]
frames = 30
loop = true
crossfade_in = 0.25
events = {}
speed = 0.45
kind = "ambient"

[duck.idle]
frames = 90
loop = true
crossfade_in = 0.30
events = {}
kind = "ambient"

[duck.dip]
frames = 60
loop = false
crossfade_in = 0.15
events = { dip_under = 11, dip_up = 46 }
kind = "ambient"

[duck.flap]
frames = 45
loop = false
crossfade_in = 0.10
events = { flap_peak = 14, splash = 38 }
kind = "ambient"

[duck.preen]
frames = 75
loop = false
crossfade_in = 0.20
events = {}
kind = "ambient"

[duckling.swim]
