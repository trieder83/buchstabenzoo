[package]
name = "zoo-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
glam = "0.33.10"
js-sys = "0.3.83"
serde_json = "1.0.151"
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.83", features = ["console", "HtmlCanvasElement"] }
zoo-assets = { path = "../zoo-assets", default-features = false }
zoo-core = { version = "0.1.0", path = "../zoo-core" }
zoo-render = { version = "0.1.0", path = "../zoo-render" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os"]
