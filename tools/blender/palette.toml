tyre             = { index = 198, hex = "#3A3638" }
cone_orange      = { index = 199, hex = "#F28A2E" }
iron             = { index = 200, hex = "#4E4A50" } # gate straps, rings, padlock
brass            = { index = 201, hex = "#E8B436" } # padlock
