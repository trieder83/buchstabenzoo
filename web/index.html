<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Buchstabenzoo</title>
    <!-- Installable web app (TECH-PLATFORMS "Installable and full screen"): no service worker. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#3b2314" />
    <!-- Samsung Internet / Chrome force-dark would recolour the comic buttons dark brown -->
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Buchstabenzoo" />
    <style>
      :root {
        color-scheme: light;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #5e8c3d;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        font-family: 'Andika', 'Comic Neue', 'Nunito', 'Arial Rounded MT Bold', 'DejaVu Sans', sans-serif;
        color: #3b2314;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        touch-action: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        display: block;
        touch-action: none;
        outline: none;
      }
      /* Floating joystick (GAME-PLAYER §3): only in touch mode; rests bottom-left and jumps
         under the left thumb while held. */
      #stick {
        position: fixed;
        left: calc(env(safe-area-inset-left) + 96px);
        top: calc(100dvh - env(safe-area-inset-bottom) - 120px);
        width: 120px;
        height: 120px;
        margin: -60px 0 0 -60px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.22);
        border: 4px solid rgba(59, 35, 20, 0.45);
        box-sizing: border-box;
        pointer-events: none;
        display: none;
        opacity: 0.55;
      }
      body.touch #stick {
        display: block;
      }
      #stick.active {
        opacity: 0.95;
      }
      #knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 60px;
        height: 60px;
        margin: -30px 0 0 -30px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.9);
        border: 4px solid #3b2314;
        box-sizing: border-box;
      }
      .round {
        border-radius: 50%;
        border: 5px solid #3b2314;
        background: #fff3d6;
        box-shadow: 0 5px 0 rgba(59, 35, 20, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      /* Touch interact button, bottom-right in right-thumb reach (≥ 64 px, safe area). */
      #act {
        position: fixed;
        right: calc(24px + env(safe-area-inset-right));
        bottom: calc(28px + env(safe-area-inset-bottom));
        width: 96px;
        height: 96px;
        font-size: 50px;
        background: #ffd65c;
      }
      /* Desktop key hint (can also be clicked). */
      #hint {
        position: fixed;
        left: 50%;
        bottom: calc(28px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 10px 22px 10px 12px;
        border-radius: 40px;
        border: 5px solid #3b2314;
        background: #ffd65c;
        box-shadow: 0 5px 0 rgba(59, 35, 20, 0.55);
        font-size: 40px;
      }
      #hint .key {
        display: inline-block;
        min-width: 56px;
        padding: 2px 8px;
        border-radius: 12px;
        border: 4px solid #3b2314;
        background: #fff;
        font-weight: bold;
        font-size: 36px;
        text-align: center;
      }
      #hud-carry {
        position: fixed;
        left: calc(16px + env(safe-area-inset-left));
        top: calc(16px + env(safe-area-inset-top));
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 8px 20px 8px 12px;
        border-radius: 40px;
        border: 5px solid #3b2314;
        background: #fff3d6;
        font-size: 30px;
        font-weight: bold;
      }
      /* Put-down button (GAME-FEED §8): below the carried-item HUD, ≥ 64 px, icon only. */
      #drop-btn {
        position: fixed;
        left: calc(16px + env(safe-area-inset-left));
        top: calc(100px + env(safe-area-inset-top));
        width: 76px;
        height: 76px;
        font-size: 30px;
        letter-spacing: -4px;
      }
      #drop-btn.shake {
        animation: shake 0.4s;
      }
      @keyframes shake {
        20%,
        60% {
          transform: translateX(-8px);
        }
        40%,
        80% {
          transform: translateX(8px);
        }
      }
      /* Readable icons above lying foods (GAME-FEED §10). */
      #lying-icons {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #lying-icons .lying-icon {
        position: absolute;
        left: 0;
        top: 0;
        font-size: 30px;
        padding: 2px 6px;
        border-radius: 14px;
        border: 3px solid #3b2314;
        background: rgba(255, 243, 214, 0.9);
      }
      #hud-carry .icon {
        font-size: 40px;
      }
      #hud-carry .bowl {
        font-size: 40px;
        padding-right: 8px;
        border-right: 2px solid rgba(59, 35, 20, 0.25);
      }
      .panel-hint {
        margin: 6px 0 0;
        font-size: 0.8em;
        font-style: italic;
      }
      /* Camera views (GAME-CAMERA-VIEWS 3a): ONE button cycles zoo -> first person ->
         look-around; its icon shows the CURRENT view. Bottom right above the interact button
         (right-thumb zone, also on desktop). */
      #view-btn {
        position: fixed;
        right: calc(34px + env(safe-area-inset-right));
        bottom: calc(144px + env(safe-area-inset-bottom));
        width: 76px;
        height: 76px;
        font-size: 38px;
      }
      #view-btn[data-view='first_person'],
      #view-btn[data-view='look_around'] {
        background: #ffd65c;
      }
      #settings-btn {
        position: fixed;
        right: calc(16px + env(safe-area-inset-right));
        top: calc(16px + env(safe-area-inset-top));
        width: 68px;
        height: 68px;
        font-size: 36px;
      }
      /* GAME-HINT: the 🧭 hint button directly below the gear (≥ 64 px), the bouncing
         indicator above the target (DOM overlay: always visible, also through trees), the
         edge arrow with distance dots when the target is off-screen. */
      #compass-btn {
        position: fixed;
        right: calc(16px + env(safe-area-inset-right));
        top: calc(96px + env(safe-area-inset-top));
        width: 68px;
        height: 68px;
        font-size: 36px;
      }
      #compass-btn.on {
        background: #ffd65c;
      }
      #compass-btn.pulse {
        animation: nudge 1.1s ease-in-out 2;
      }
      @keyframes nudge {
        50% {
          transform: scale(1.18);
          box-shadow: 0 0 0 10px rgba(255, 214, 92, 0.6);
        }
      }
      #hint-marker,
      #hint-edge {
        position: fixed;
        left: 0;
        top: 0;
        pointer-events: none;
      }
      #hint-marker .bob {
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: bob 0.9s ease-in-out infinite alternate;
      }
      #hint-marker .icon,
      #hint-edge .icon {
        width: 56px;
        height: 56px;
        box-sizing: border-box;
        border-radius: 50%;
        border: 5px solid #3b2314;
        background: #ffd65c;
        font-size: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 16px rgba(255, 244, 201, 0.9);
      }
      #hint-marker .line,
      #hint-edge .line {
        margin-top: 4px;
        max-width: 220px;
        padding: 4px 10px;
        border-radius: 14px;
        border: 3px solid #3b2314;
        background: #fff8e0;
        font-size: 16px;
        font-weight: 700;
        text-align: center;
        line-height: 1.15;
      }
      #hint-marker .line:empty,
      #hint-edge .line:empty {
        display: none;
      }
      #hint-marker .arrow {
        font-size: 34px;
        line-height: 1;
        color: #ffd65c;
        -webkit-text-stroke: 3px #3b2314;
        margin-top: -4px;
      }
      @keyframes bob {
        to {
          transform: translateY(-16px);
        }
      }
      #hint-edge .spin {
        position: absolute;
        left: 28px;
        top: 28px;
        width: 0;
        height: 0;
      }
      #hint-edge .spin span {
        position: absolute;
        left: 30px;
        top: -22px;
        font-size: 40px;
        line-height: 44px;
        color: #ffd65c;
        -webkit-text-stroke: 3px #3b2314;
        animation: poke 0.8s ease-in-out infinite alternate;
      }
      @keyframes poke {
        to {
          transform: translateX(8px);
        }
      }
      #hint-edge .dots {
        position: absolute;
        left: 28px;
        top: 62px;
        transform: translateX(-50%);
        display: flex;
        gap: 4px;
      }
      #hint-edge .dots i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        border: 2px solid #3b2314;
        background: #fff3d6;
      }
      /* GAME-NIGHT rule 11 "Compass shows what is missing": the task badge (kind of the next
         task) sits on the 🧭, the compass strip (missing animals of the level) hangs below it
         (a row left of it on low landscape screens). Both are children of the button: display
         only, a tap on them is the compass tap. */
      #compass-btn {
        overflow: visible;
      }
      #compass-btn .badge {
        position: absolute;
        left: -10px;
        bottom: -8px;
        min-width: 32px;
        height: 32px;
        box-sizing: border-box;
        padding: 0 3px;
        border-radius: 16px;
        border: 3px solid #3b2314;
        background: #fff;
        font-size: 18px;
        line-height: 26px;
        text-align: center;
        white-space: nowrap;
      }
      #compass-btn .badge[data-badge='moon_door'] {
        font-size: 13px;
      }
      #compass-btn .badge[data-badge='night_coming'],
      #compass-btn .badge[data-badge='bed'],
      #compass-btn .badge[data-badge='moon_door'] {
        background: #2e3e7a;
      }
      #compass-btn .badge[data-badge='night_coming'] {
        animation: moonglow 1.2s ease-in-out infinite alternate;
      }
      @keyframes moonglow {
        to {
          box-shadow: 0 0 14px 5px #ffd66b;
        }
      }
      #compass-btn .strip {
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
      }
      #compass-btn .strip .pa {
        width: 34px;
        height: 34px;
        box-sizing: border-box;
        border-radius: 50%;
        border: 3px solid #3b2314;
        background: #fff3d6;
        font-size: 20px;
        line-height: 28px;
        text-align: center;
        font-weight: bold;
      }
      #compass-btn .strip .pa {
        position: relative;
      }
      #compass-btn .strip .pa .half-tag {
        position: absolute;
        right: -8px;
        bottom: -8px;
        min-width: 18px;
        height: 18px;
        border-radius: 9px;
        border: 2px solid #3b2314;
        background: #ffd65c;
        font-size: 12px;
        line-height: 14px;
        text-align: center;
      }
      #compass-btn .strip .pa.more {
        font-size: 14px;
        background: #fff;
      }
      #compass-btn .strip .pa.hl {
        background: #ffd65c;
        animation: nudge 0.8s ease-in-out infinite;
      }
      @media (orientation: landscape) and (max-height: 540px) {
        #compass-btn .strip {
          top: 50%;
          left: auto;
          right: 100%;
          transform: translateY(-50%);
          margin: 0 10px 0 0;
          flex-direction: row;
        }
      }
      /* Small screens (GAME-PLAYER §3 "Small screens": landscape height <= 460 CSS px or
         portrait width <= 480): all right-hand controls form ONE column along the right border
         (gear, compass, view button above the interact button, equal 8 px gaps) and the compass
         strip is collapsed until the compass is tapped (it then shows for ~6 s, class
         .expanded; HINT-023). */
      @media (orientation: landscape) and (max-height: 460px), (orientation: portrait) and (max-width: 480px) {
        #settings-btn,
        #compass-btn,
        #view-btn {
          right: calc(16px + env(safe-area-inset-right));
          width: 64px;
          height: 64px;
          font-size: 32px;
        }
        #settings-btn {
          top: calc(8px + env(safe-area-inset-top));
        }
        #compass-btn {
          top: calc(80px + env(safe-area-inset-top));
        }
        #act {
          right: calc(8px + env(safe-area-inset-right));
          bottom: calc(8px + env(safe-area-inset-bottom));
          width: 80px;
          height: 80px;
          font-size: 42px;
        }
        #view-btn {
          bottom: calc(96px + env(safe-area-inset-bottom));
        }
        #compass-btn .strip {
          display: none;
          top: 50%;
          left: auto;
          right: 100%;
          transform: translateY(-50%);
          margin: 0 14px 0 0;
          flex-direction: row;
        }
        #compass-btn.expanded .strip {
          display: flex;
        }
        /* something is missing: a pulsing dot while the strip is collapsed */
        #compass-btn:not(.expanded):not([data-missing='0'])[data-missing]::after {
          content: '';
          position: absolute;
          right: -4px;
          top: -4px;
          width: 14px;
          height: 14px;
          border-radius: 50%;
          border: 3px solid #3b2314;
          background: #ffd65c;
          animation: dotpulse 1.2s ease-in-out infinite alternate;
        }
      }
      @keyframes dotpulse {
        to {
          transform: scale(1.35);
        }
      }
      #intro {
        position: fixed;
        inset: 0;
        z-index: 6;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(30, 20, 10, 0.55);
      }
      #intro[hidden] {
        display: none;
      }
      #intro .intro-card {
        position: relative;
        box-sizing: border-box;
        width: min(92vw, 720px);
        padding: 24px 20px 96px;
        border-radius: 28px;
        border: 6px solid #3b2314;
        background: #fff3d6;
        text-align: center;
      }
      #intro .intro-pic {
        font-size: clamp(56px, 16vw, 110px);
        line-height: 1.1;
      }
      #intro .intro-text {
        margin: 12px 0 0;
        font-size: clamp(22px, 5vw, 34px);
        font-weight: 700;
        color: #3b2314;
      }
      #intro .intro-dots {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 14px;
      }
      #intro .intro-dots i {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 3px solid #3b2314;
        background: #fff;
      }
      #intro .intro-dots i.on {
        background: #ffd65c;
      }
      #intro .intro-next,
      #intro .intro-skip {
        position: absolute;
        bottom: 16px;
        width: 72px;
        height: 72px;
        font-size: 36px;
      }
      #intro .intro-next {
        right: 16px;
      }
      #intro .intro-skip {
        left: 16px;
      }
      #settings {
        position: fixed;
        right: calc(16px + env(safe-area-inset-right));
        top: calc(100px + env(safe-area-inset-top));
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 16px;
        border-radius: 24px;
        border: 5px solid #3b2314;
        background: #fff3d6;
        /* short landscape phones: the menu scrolls instead of leaving the screen (PLAT-021) */
        max-height: calc(100dvh - 116px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        box-sizing: border-box;
        overflow-y: auto;
        touch-action: pan-y;
      }
      #settings .row {
        display: flex;
        gap: 12px;
      }
      #settings .choice {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        border: 4px solid #3b2314;
        background: #fff;
        font-size: 36px;
        font-weight: bold;
      }
      #settings .install-hint {
        margin: 0;
        max-width: 240px;
        font-size: 18px;
        font-weight: bold;
        line-height: 1.25;
        color: #5a3a22;
      }
      #settings .confirm {
        gap: 12px;
      }
      #settings .choice.yes {
        background: #7cc46a;
      }
      #settings .choice.no {
        background: #e8604c;
        color: #fff;
      }
      #settings .choice.on {
        background: #ffd65c;
        box-shadow: inset 0 0 0 4px #e8604c;
      }
      /* Close-up text panel (GAME-PLAYER §4): cap height ≥ 3 % of the viewport (ADIR-003). */
      /* Reading panels open by themselves and never block walking (GAME-PLAYER §4): only the
         panel box takes input, and it ends above the player (drawn at the screen centre):
         top of the screen, at most 38 % of its height; longer texts scroll. It lies above
         the HUD and the gear while open (its own ✖ closes it). Landscape: two columns. */
      #panel {
        --panel-top: calc(10px + env(safe-area-inset-top));
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        z-index: 3;
        display: flex;
        justify-content: center;
        pointer-events: none;
        padding: var(--panel-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
      }
      #settings {
        z-index: 4;
      }
      .panel-body {
        --read: max(4.4vh, 22px);
        position: relative;
        box-sizing: border-box;
        width: min(96vw, 1180px);
        max-height: calc(38dvh - var(--panel-top));
        pointer-events: auto;
        overflow: hidden;
        padding: 10px 12px 12px;
        border-radius: 22px;
        border: 6px solid #3b2314;
        background: #fff8e7;
        box-shadow: 0 8px 0 rgba(59, 35, 20, 0.5);
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .panel-body[data-kind='food_box'] {
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 4vw;
      }
      .panel-body[data-kind='food_box'] > .panel-close {
        position: absolute;
        right: 6px;
        top: 6px;
      }
      /* riddle + food word: never scroll (QA F2); the close button floats top-right */
      .panel-main {
        flex: 0 0 auto;
        display: block;
      }
      .panel-main::after {
        content: '';
        display: block;
        clear: both;
      }
      .panel-main > .panel-close {
        position: static;
        float: right;
        margin: 0 0 4px 8px;
      }
      .panel-text {
        margin: 0;
        font-size: var(--read, max(4.6vh, 22px));
        line-height: 1.25;
        font-weight: bold;
      }
      .panel-main > .panel-text {
        display: inline;
      }
      .panel-main > .panel-food {
        display: inline-flex;
        margin: 4px 0 0 12px;
        vertical-align: middle;
      }
      /* "more about the animal": heading + facts, scrolls inside the panel */
      .panel-more {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        touch-action: pan-y;
        border-top: 4px dashed #d9c49a;
        padding-top: 6px;
      }
      /* scrollbar styled like the dialog (GAME-PLAYER §4): rounded brown thumb on a cream
         track, only visible when there is something to scroll */
      .panel-more {
        scrollbar-width: auto;
        scrollbar-color: #8a5a35 #f3e3bf;
        cursor: grab;
      }
      .panel-more::-webkit-scrollbar {
        width: 16px;
      }
      .panel-more::-webkit-scrollbar-track {
        background: #f3e3bf;
        border-radius: 10px;
        border: 3px solid #fff8e7;
      }
      .panel-more::-webkit-scrollbar-thumb {
        background: #8a5a35;
        border-radius: 10px;
        border: 3px solid #f3e3bf;
        min-height: 40px;
      }
      .panel-more::-webkit-scrollbar-thumb:active {
        background: #6b4428;
      }
      @media (orientation: landscape) {
        .panel-body[data-kind='info_board'] {
          display: grid;
          grid-template-columns: 3fr 1fr;
          column-gap: 16px;
          align-items: start;
        }
        .panel-body[data-kind='info_board'] > .panel-more {
          max-height: calc(38dvh - var(--panel-top) - 34px);
          border-top: 0;
          border-left: 4px dashed #d9c49a;
          padding: 0 0 0 12px;
        }
      }
      /* RESC-028: the welcome board is long; it scrolls inside the panel box */
      .panel-body[data-kind='welcome_board'] {
        overflow-y: auto;
        overscroll-behavior: contain;
        touch-action: pan-y;
        cursor: grab;
        gap: 6px;
        padding-right: 80px;
        max-height: calc(64dvh - var(--panel-top));
      }
      /* scroll cue (QA 2026-10-02: a small child never saw the steps below): a bouncing arrow at
         the bottom edge while there is more to read */
      .panel-body[data-kind='welcome_board']::after {
        content: '▼';
        position: sticky;
        bottom: -4px;
        flex: none;
        display: block;
        margin-top: auto;
        padding-top: 18px;
        text-align: center;
        font-size: max(4.4vh, 30px);
        line-height: 1;
        color: #3b2314;
        background: linear-gradient(rgba(255, 248, 231, 0), #fff8e7 70%);
        pointer-events: none;
        animation: welcome-cue 0.9s ease-in-out infinite alternate;
      }
      .panel-body[data-kind='welcome_board'][data-end='1']::after {
        display: none;
      }
      @keyframes welcome-cue {
        from {
          transform: translateY(-4px);
        }
        to {
          transform: translateY(4px);
        }
      }
      .panel-body[data-kind='welcome_board'] > .panel-picture {
        font-size: max(6vh, 36px);
      }
      .panel-body[data-kind='welcome_board'] > .panel-close {
        position: absolute;
        right: 8px;
        top: 8px;
      }
      .welcome-goal {
        margin: 0;
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: center;
        font-size: var(--read);
        font-weight: bold;
      }
      .welcome-goal .icons {
        font-size: calc(var(--read) * 1.5);
      }
      .welcome-steps {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 4px;
        text-align: left;
        font-size: var(--read);
        font-weight: bold;
      }
      .welcome-step {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .welcome-step .icon {
        font-size: calc(var(--read) * 1.5);
        min-width: 1.4em;
        text-align: center;
      }
      .welcome-level,
      .welcome-start {
        margin: 0;
        font-size: var(--read);
        font-weight: bold;
        color: #5a3a22;
      }
      .panel-title {
        margin: 0 0 4px;
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: center;
        font-size: calc(var(--read) * 0.85);
        line-height: 1.1;
      }
      .panel-facts {
        margin: 0;
        font-size: var(--read);
        line-height: 1.22;
        font-weight: bold;
        color: #5a3a22;
      }
      .panel-picture {
        font-size: max(10vh, 44px);
        line-height: 1;
      }
      .panel-food {
        margin: 0;
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 2px 14px;
        border-radius: 16px;
        border: 4px dashed #8a5a35;
        font-size: var(--read, max(4.2vh, 20px));
        font-weight: bold;
      }
      .panel-close {
        position: absolute;
        right: 8px;
        top: 8px;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 4px solid #3b2314;
        background: #fff;
        font-size: 28px;
      }
      .take {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        border: 6px solid #3b2314;
        background: #7cc46a;
        font-size: 58px;
        box-shadow: 0 6px 0 rgba(59, 35, 20, 0.55);
      }
      #bubble {
        position: fixed;
        left: 50%;
        top: calc(22% + env(safe-area-inset-top));
        transform: translateX(-50%);
        max-width: 80vw;
        padding: 14px 26px;
        border-radius: 26px;
        border: 5px solid #3b2314;
        background: #fff;
        font-size: max(3.4vh, 22px);
        font-weight: bold;
        text-align: center;
        pointer-events: none;
      }
      #bubble[data-near='compass'] {
        left: auto;
        right: calc(100px + env(safe-area-inset-right));
        top: calc(180px + env(safe-area-inset-top));
        transform: none;
        max-width: min(60vw, 340px);
        font-size: max(2.6vh, 18px);
      }
      #celebrate {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .celebrate-text {
        position: absolute;
        left: 50%;
        top: 30%;
        transform: translate(-50%, -50%);
        width: min(88vw, 1000px);
        padding: 24px 32px;
        border-radius: 28px;
        border: 7px solid #3b2314;
        background: #ffd65c;
        font-size: max(4.6vh, 24px);
        font-weight: bold;
        text-align: center;
        animation: pop 0.5s ease-out;
      }
      .confetti {
        position: absolute;
        top: -20px;
        width: 14px;
        height: 22px;
        border-radius: 3px;
        animation: fall 2.6s linear infinite;
      }
      @keyframes fall {
        to {
          top: 105%;
          transform: rotate(540deg);
        }
      }
      @keyframes pop {
        from {
          transform: translate(-50%, -50%) scale(0.4);
        }
      }
      /* GAME-NIGHT: gentle dusk cut-in, the dream fade while sleeping, the two night
         choices as icons (no reading needed) */
      #night-banner {
        position: fixed;
        left: 50%;
        top: calc(14% + env(safe-area-inset-top));
        transform: translateX(-50%);
        max-width: 84vw;
        padding: 14px 28px;
        border-radius: 26px;
        border: 5px solid #3b2314;
        background: #2e3e7a;
        color: #fff4c9;
        font-size: max(3.4vh, 22px);
        font-weight: bold;
        text-align: center;
        pointer-events: none;
        animation: fadein 1.2s ease-out;
      }
      @keyframes fadein {
        from {
          opacity: 0;
        }
      }
      #dream {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(circle at 50% 45%, #3b4c8c 0%, #1e2a5a 70%);
        opacity: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18vh;
      }
      #night-choices {
        position: fixed;
        left: calc(12px + env(safe-area-inset-left));
        top: calc(50% - 70px);
        display: flex;
        flex-direction: column;
        gap: 12px;
        pointer-events: none;
      }
      #night-choices span {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 4px solid #3b2314;
        background: #fff4c9;
        font-size: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 14px #ffd66b;
      }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="stick"><div id="knob"></div></div>
    <div id="hud-carry" hidden></div>
    <button id="drop-btn" class="round" type="button" hidden>✋⬇</button>
    <div id="lying-icons"></div>
    <div id="hint-marker" hidden><div class="bob"><span class="icon"></span><span class="arrow">▼</span><span class="line"></span></div></div>
    <div id="hint-edge" hidden><div class="spin"><span>➤</span></div><span class="icon"></span><span class="dots"></span><span class="line"></span></div>
    <button id="settings-btn" class="round" type="button">⚙️</button>
    <button id="compass-btn" class="round" type="button">🧭<span class="badge" hidden></span><span class="strip"></span></button>
    <button id="view-btn" class="round" type="button" data-view="zoo">🗺️</button>
    <div id="intro" hidden><div class="intro-card"><div class="intro-pic"></div><p class="intro-text"></p><div class="intro-dots"></div><button class="intro-skip round" type="button">✖</button><button class="intro-next round" type="button">➤</button></div></div>
    <div id="settings" hidden></div>
    <button id="hint" type="button" hidden><span class="key">E</span><span class="icon"></span></button>
    <button id="act" class="round" type="button" hidden></button>
    <div id="bubble" hidden></div>
    <div id="panel" hidden></div>
    <div id="celebrate" hidden></div>
    <div id="night-choices" hidden><span id="choice-bed">🛏️</span><span id="choice-moon">🌙</span></div>
    <div id="night-banner" hidden></div>
    <div id="dream"><span>💤</span></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
