<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Buchstabenzoo</title>
    <style>
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #5e8c3d;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        font-family: 'Andika', 'Comic Neue', 'Nunito', 'Arial Rounded MT Bold', 'DejaVu Sans', sans-serif;
        color: #3b2314;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        touch-action: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        display: block;
        touch-action: none;
        outline: none;
      }
      /* Floating joystick (GAME-PLAYER §3): only in touch mode; rests bottom-left and jumps
         under the left thumb while held. */
      #stick {
        position: fixed;
        left: calc(env(safe-area-inset-left) + 96px);
        top: calc(100dvh - env(safe-area-inset-bottom) - 120px);
        width: 120px;
        height: 120px;
        margin: -60px 0 0 -60px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.22);
        border: 4px solid rgba(59, 35, 20, 0.45);
        box-sizing: border-box;
        pointer-events: none;
        display: none;
        opacity: 0.55;
      }
      body.touch #stick {
        display: block;
      }
      #stick.active {
        opacity: 0.95;
      }
      #knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 60px;
        height: 60px;
        margin: -30px 0 0 -30px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.9);
        border: 4px solid #3b2314;
        box-sizing: border-box;
      }
      .round {
        border-radius: 50%;
        border: 5px solid #3b2314;
        background: #fff3d6;
        box-shadow: 0 5px 0 rgba(59, 35, 20, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      /* Touch interact button, bottom-right in right-thumb reach (≥ 64 px, safe area). */
      #act {
        position: fixed;
        right: calc(24px + env(safe-area-inset-right));
        bottom: calc(28px + env(safe-area-inset-bottom));
        width: 96px;
        height: 96px;
        font-size: 50px;
        background: #ffd65c;
      }
      /* Desktop key hint (can also be clicked). */
      #hint {
        position: fixed;
        left: 50%;
        bottom: calc(28px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 10px 22px 10px 12px;
        border-radius: 40px;
        border: 5px solid #3b2314;
        background: #ffd65c;
        box-shadow: 0 5px 0 rgba(59, 35, 20, 0.55);
        font-size: 40px;
      }
      #hint .key {
        display: inline-block;
        min-width: 56px;
        padding: 2px 8px;
        border-radius: 12px;
        border: 4px solid #3b2314;
        background: #fff;
        font-weight: bold;
        font-size: 36px;
        text-align: center;
      }
      #hud-carry {
        position: fixed;
        left: calc(16px + env(safe-area-inset-left));
        top: calc(16px + env(safe-area-inset-top));
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 8px 20px 8px 12px;
        border-radius: 40px;
        border: 5px solid #3b2314;
        background: #fff3d6;
        font-size: 30px;
        font-weight: bold;
      }
      #hud-carry .icon {
        font-size: 40px;
      }
      #settings-btn {
        position: fixed;
        right: calc(16px + env(safe-area-inset-right));
        top: calc(16px + env(safe-area-inset-top));
        width: 68px;
        height: 68px;
        font-size: 36px;
      }
      #settings {
        position: fixed;
        right: calc(16px + env(safe-area-inset-right));
        top: calc(100px + env(safe-area-inset-top));
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 16px;
        border-radius: 24px;
        border: 5px solid #3b2314;
        background: #fff3d6;
      }
      #settings .row {
        display: flex;
        gap: 12px;
      }
      #settings .choice {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        border: 4px solid #3b2314;
        background: #fff;
        font-size: 36px;
        font-weight: bold;
      }
      #settings .confirm {
        gap: 12px;
      }
      #settings .choice.yes {
        background: #7cc46a;
      }
      #settings .choice.no {
        background: #e8604c;
        color: #fff;
      }
      #settings .choice.on {
        background: #ffd65c;
        box-shadow: inset 0 0 0 4px #e8604c;
      }
      /* Close-up text panel (GAME-PLAYER §4): cap height ≥ 3 % of the viewport (ADIR-003). */
      /* Reading panels open by themselves and never block walking (GAME-PLAYER §4): only the
         panel box takes input, and it ends above the player (drawn at the screen centre):
         top of the screen, at most 38 % of its height; longer texts scroll. It lies above
         the HUD and the gear while open (its own ✖ closes it). Landscape: two columns. */
      #panel {
        --panel-top: calc(10px + env(safe-area-inset-top));
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        z-index: 3;
        display: flex;
        justify-content: center;
        pointer-events: none;
        padding: var(--panel-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
      }
      #settings {
        z-index: 4;
      }
      .panel-body {
        --read: max(4.4vh, 22px);
        position: relative;
        box-sizing: border-box;
        width: min(96vw, 1180px);
        max-height: calc(38dvh - var(--panel-top));
        pointer-events: auto;
        overflow: hidden;
        padding: 10px 12px 12px;
        border-radius: 22px;
        border: 6px solid #3b2314;
        background: #fff8e7;
        box-shadow: 0 8px 0 rgba(59, 35, 20, 0.5);
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .panel-body[data-kind='food_box'] {
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 4vw;
      }
      .panel-body[data-kind='food_box'] > .panel-close {
        position: absolute;
        right: 6px;
        top: 6px;
      }
      /* riddle + food word: never scroll (QA F2); the close button floats top-right */
      .panel-main {
        flex: 0 0 auto;
        display: block;
      }
      .panel-main::after {
        content: '';
        display: block;
        clear: both;
      }
      .panel-main > .panel-close {
        position: static;
        float: right;
        margin: 0 0 4px 8px;
      }
      .panel-text {
        margin: 0;
        font-size: var(--read, max(4.6vh, 22px));
        line-height: 1.25;
        font-weight: bold;
      }
      .panel-main > .panel-text {
        display: inline;
      }
      .panel-main > .panel-food {
        display: inline-flex;
        margin: 4px 0 0 12px;
        vertical-align: middle;
      }
      /* "more about the animal": heading + facts, scrolls inside the panel */
      .panel-more {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        touch-action: pan-y;
        border-top: 4px dashed #d9c49a;
        padding-top: 6px;
      }
      /* scrollbar styled like the dialog (GAME-PLAYER §4): rounded brown thumb on a cream
         track, only visible when there is something to scroll */
      .panel-more {
        scrollbar-width: auto;
        scrollbar-color: #8a5a35 #f3e3bf;
        cursor: grab;
      }
      .panel-more::-webkit-scrollbar {
        width: 16px;
      }
      .panel-more::-webkit-scrollbar-track {
        background: #f3e3bf;
        border-radius: 10px;
        border: 3px solid #fff8e7;
      }
      .panel-more::-webkit-scrollbar-thumb {
        background: #8a5a35;
        border-radius: 10px;
        border: 3px solid #f3e3bf;
        min-height: 40px;
      }
      .panel-more::-webkit-scrollbar-thumb:active {
        background: #6b4428;
      }
      @media (orientation: landscape) {
        .panel-body[data-kind='info_board'] {
          display: grid;
          grid-template-columns: 3fr 1fr;
          column-gap: 16px;
          align-items: start;
        }
        .panel-body[data-kind='info_board'] > .panel-more {
          max-height: calc(38dvh - var(--panel-top) - 34px);
          border-top: 0;
          border-left: 4px dashed #d9c49a;
          padding: 0 0 0 12px;
        }
      }
      .panel-title {
        margin: 0 0 4px;
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: center;
        font-size: calc(var(--read) * 0.85);
        line-height: 1.1;
      }
      .panel-facts {
        margin: 0;
        font-size: var(--read);
        line-height: 1.22;
        font-weight: bold;
        color: #5a3a22;
      }
      .panel-picture {
        font-size: max(10vh, 44px);
        line-height: 1;
      }
      .panel-food {
        margin: 0;
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 2px 14px;
        border-radius: 16px;
        border: 4px dashed #8a5a35;
        font-size: var(--read, max(4.2vh, 20px));
        font-weight: bold;
      }
      .panel-close {
        position: absolute;
        right: 8px;
        top: 8px;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 4px solid #3b2314;
        background: #fff;
        font-size: 28px;
      }
      .take {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        border: 6px solid #3b2314;
        background: #7cc46a;
        font-size: 58px;
        box-shadow: 0 6px 0 rgba(59, 35, 20, 0.55);
      }
      #bubble {
        position: fixed;
        left: 50%;
        top: calc(22% + env(safe-area-inset-top));
        transform: translateX(-50%);
        max-width: 80vw;
        padding: 14px 26px;
        border-radius: 26px;
        border: 5px solid #3b2314;
        background: #fff;
        font-size: max(3.4vh, 22px);
        font-weight: bold;
        text-align: center;
        pointer-events: none;
      }
      #celebrate {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .celebrate-text {
        position: absolute;
        left: 50%;
        top: 30%;
        transform: translate(-50%, -50%);
        width: min(88vw, 1000px);
        padding: 24px 32px;
        border-radius: 28px;
        border: 7px solid #3b2314;
        background: #ffd65c;
        font-size: max(4.6vh, 24px);
        font-weight: bold;
        text-align: center;
        animation: pop 0.5s ease-out;
      }
      .confetti {
        position: absolute;
        top: -20px;
        width: 14px;
        height: 22px;
        border-radius: 3px;
        animation: fall 2.6s linear infinite;
      }
      @keyframes fall {
        to {
          top: 105%;
          transform: rotate(540deg);
        }
      }
      @keyframes pop {
        from {
          transform: translate(-50%, -50%) scale(0.4);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="stick"><div id="knob"></div></div>
    <div id="hud-carry" hidden></div>
    <button id="settings-btn" class="round" type="button">⚙️</button>
    <div id="settings" hidden></div>
    <button id="hint" type="button" hidden><span class="key">E</span><span class="icon"></span></button>
    <button id="act" class="round" type="button" hidden></button>
    <div id="bubble" hidden></div>
    <div id="panel" hidden></div>
    <div id="celebrate" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
