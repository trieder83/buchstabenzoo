<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Buchstabenzoo</title>
    <style>
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #5e8c3d;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        font-family: 'Andika', 'Comic Neue', 'Nunito', 'Arial Rounded MT Bold', 'DejaVu Sans', sans-serif;
        color: #3b2314;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        touch-action: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        display: block;
        touch-action: none;
        outline: none;
      }
      /* Floating joystick (GAME-PLAYER §3): only in touch mode; rests bottom-left and jumps
         under the left thumb while held. */
      #stick {
        position: fixed;
        left: calc(env(safe-area-inset-left) + 96px);
        top: calc(100dvh - env(safe-area-inset-bottom) - 120px);
        width: 120px;
        height: 120px;
        margin: -60px 0 0 -60px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.22);
        border: 4px solid rgba(59, 35, 20, 0.45);
        box-sizing: border-box;
        pointer-events: none;
        display: none;
        opacity: 0.55;
      }
      body.touch #stick {
        display: block;
      }
      #stick.active {
        opacity: 0.95;
      }
      #knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 60px;
        height: 60px;
        margin: -30px 0 0 -30px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.9);
        border: 4px solid #3b2314;
        box-sizing: border-box;
      }
      .round {
        border-radius: 50%;
        border: 5px solid #3b2314;
        background: #fff3d6;
        box-shadow: 0 5px 0 rgba(59, 35, 20, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      /* Touch interact button, bottom-right in right-thumb reach (≥ 64 px, safe area). */
      #act {
        position: fixed;
        right: calc(24px + env(safe-area-inset-right));
        bottom: calc(28px + env(safe-area-inset-bottom));
        width: 96px;
        height: 96px;
        font-size: 50px;
        background: #ffd65c;
      }
      /* Desktop key hint (can also be clicked). */
      #hint {
        position: fixed;
        left: 50%;
        bottom: calc(28px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 10px 22px 10px 12px;
        border-radius: 40px;
        border: 5px solid #3b2314;
        background: #ffd65c;
        box-shadow: 0 5px 0 rgba(59, 35, 20, 0.55);
        font-size: 40px;
      }
      #hint .key {
        display: inline-block;
        min-width: 56px;
        padding: 2px 8px;
        border-radius: 12px;
        border: 4px solid #3b2314;
        background: #fff;
        font-weight: bold;
        font-size: 36px;
        text-align: center;
      }
      #hud-carry {
        position: fixed;
        left: calc(16px + env(safe-area-inset-left));
        top: calc(16px + env(safe-area-inset-top));
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 8px 20px 8px 12px;
        border-radius: 40px;
        border: 5px solid #3b2314;
        background: #fff3d6;
        font-size: 30px;
        font-weight: bold;
      }
      #hud-carry .icon {
        font-size: 40px;
      }
      #settings-btn {
        position: fixed;
        right: calc(16px + env(safe-area-inset-right));
        top: calc(16px + env(safe-area-inset-top));
        width: 68px;
        height: 68px;
        font-size: 36px;
      }
      #settings {
        position: fixed;
        right: calc(16px + env(safe-area-inset-right));
        top: calc(100px + env(safe-area-inset-top));
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 16px;
        border-radius: 24px;
        border: 5px solid #3b2314;
        background: #fff3d6;
      }
      #settings .row {
        display: flex;
        gap: 12px;
      }
      #settings .choice {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        border: 4px solid #3b2314;
        background: #fff;
        font-size: 36px;
        font-weight: bold;
      }
      #settings .choice.on {
        background: #ffd65c;
        box-shadow: inset 0 0 0 4px #e8604c;
      }
      /* Close-up text panel (GAME-PLAYER §4): cap height ≥ 3 % of the viewport (ADIR-003). */
      #panel {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        background: rgba(40, 30, 20, 0.2);
        /* upper part of the screen, below HUD/gear: the player stays visible */
        padding: calc(96px + env(safe-area-inset-top)) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      .panel-body {
        position: relative;
        box-sizing: border-box;
        width: min(92vw, 1100px);
        max-height: calc(100dvh - 120px);
        overflow: hidden;
        padding: 40px 84px 32px;
        border-radius: 28px;
        border: 7px solid #3b2314;
        background: #fff8e7;
        box-shadow: 0 10px 0 rgba(59, 35, 20, 0.5);
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2.2vh;
      }
      .panel-text {
        margin: 0;
        font-size: max(4.6vh, 22px);
        line-height: 1.25;
        font-weight: bold;
      }
      .panel-picture {
        font-size: max(12vh, 60px);
        line-height: 1;
      }
      .panel-food {
        margin: 0;
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 6px 24px;
        border-radius: 16px;
        border: 4px dashed #8a5a35;
        font-size: max(4.2vh, 20px);
        font-weight: bold;
      }
      .panel-close {
        position: absolute;
        right: 10px;
        top: 10px;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 4px solid #3b2314;
        background: #fff;
        font-size: 28px;
      }
      .take {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        border: 6px solid #3b2314;
        background: #7cc46a;
        font-size: 58px;
        box-shadow: 0 6px 0 rgba(59, 35, 20, 0.55);
      }
      #bubble {
        position: fixed;
        left: 50%;
        top: calc(22% + env(safe-area-inset-top));
        transform: translateX(-50%);
        max-width: 80vw;
        padding: 14px 26px;
        border-radius: 26px;
        border: 5px solid #3b2314;
        background: #fff;
        font-size: max(3.4vh, 22px);
        font-weight: bold;
        text-align: center;
        pointer-events: none;
      }
      #celebrate {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .celebrate-text {
        position: absolute;
        left: 50%;
        top: 30%;
        transform: translate(-50%, -50%);
        width: min(88vw, 1000px);
        padding: 24px 32px;
        border-radius: 28px;
        border: 7px solid #3b2314;
        background: #ffd65c;
        font-size: max(4.6vh, 24px);
        font-weight: bold;
        text-align: center;
        animation: pop 0.5s ease-out;
      }
      .confetti {
        position: absolute;
        top: -20px;
        width: 14px;
        height: 22px;
        border-radius: 3px;
        animation: fall 2.6s linear infinite;
      }
      @keyframes fall {
        to {
          top: 105%;
          transform: rotate(540deg);
        }
      }
      @keyframes pop {
        from {
          transform: translate(-50%, -50%) scale(0.4);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="stick"><div id="knob"></div></div>
    <div id="hud-carry" hidden></div>
    <button id="settings-btn" class="round" type="button">⚙️</button>
    <div id="settings" hidden></div>
    <button id="hint" type="button" hidden><span class="key">E</span><span class="icon"></span></button>
    <button id="act" class="round" type="button" hidden></button>
    <div id="bubble" hidden></div>
    <div id="panel" hidden></div>
    <div id="celebrate" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
